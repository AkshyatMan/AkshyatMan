name: Generate Snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: AkshyatMan
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2c5364&color_dots=#ebedf0,#0f2027,#203a43,#2c5364,#2c5364
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2c5364&color_dots=#161b22,#0f2027,#203a43,#2c5364,#2c5364

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
